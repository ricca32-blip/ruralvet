  let stops=[],total=0,home=homeLabel(uid);
  for(let sess of ['m','p','n']){
    let si=ints.filter(i=>(i.sess||'m')===sess);
    if(!si.length)continue;
    let prevAddr=home,prevKm=0;
    stops.push({from:'',to:home,km:0,ora:sessionIcon(sess)+' Partenza '+sessionLabel(sess),sessionStart:true});
    for(let idx=0;idx<si.length;idx++){
      let i=si[idx],a=db.aziende.find(x=>x.id==i.allId)||{nome:'Azienda',addr:'',km:0};
      let fallback=idx===0?Number(a.km||0):(Math.abs(Number(a.km||0)-prevKm)||Number(a.km||0));
      let km=await fetchKm(prevAddr,a.addr||a.nome,fallback);total+=km;
      stops.push({from:idx?prevAddr:home,to:a.nome,km:km,ora:i.ora||'',sess});
      prevAddr=a.addr||a.nome;prevKm=Number(a.km||0);
    }
    let km=await fetchKm(prevAddr,home,prevKm);total+=km;
    stops.push({from:'Ultima azienda',to:home,km:km,ora:'Rientro '+sessionLabel(sess),sess});
  }
  return{stops,total}
}

    [/rottofreno/i,45.0564,9.5500],
    [/gossolengo/i,45.0037,9.6172],
    [/291\d{2}\s+piacenza|\bpiacenza\b/i,45.0526,9.6929]
  ];
  function rv2CompanySort(){
    return (db.aziende || []).slice().sort((a,b)=>String(a.nome||'').localeCompare(String(b.nome||''),'it'));
  }
  function rv2CompanyText(a){
    return [a && a.addr, a && a.nome, a && a.fonte].filter(Boolean).join(' ');
  }
  function rv2ApproxPoint(a){
    const text = rv2CompanyText(a);
    for(const [rx, lat, lon] of RV_TOWN_COORDS){
      if(rx.test(text)) return {lat, lon, source:'approx'};
    }
    return null;
  }
  function rv2StoredPoint(a){
    if(a && rv2Finite(a.lat) && rv2Finite(a.lon)) return {lat:Number(a.lat), lon:Number(a.lon), source:'azienda'};
    const c = db.geoCache && db.geoCache[String(a && a.id)];
    if(c && rv2Finite(c.lat) && rv2Finite(c.lon)) return {lat:Number(c.lat), lon:Number(c.lon), source:'cache'};
    return null;
  }
  function rv2Point(a, allowApprox=true){
    return rv2StoredPoint(a) || (allowApprox ? rv2ApproxPoint(a) : null);
  }
  function rv2DistKm(a, b){
    const R = 6371;
    const dLat = (b.lat-a.lat) * Math.PI / 180;
    const dLon = (b.lon-a.lon) * Math.PI / 180;
    const lat1 = a.lat * Math.PI / 180;
    const lat2 = b.lat * Math.PI / 180;
    const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
    return 2 * R * Math.atan2(Math.sqrt(h), Math.sqrt(1-h));
  }
  function rv2Nearest(pos, allowApprox=true, candidates=null){
    let best = null;
    const arr = candidates || (db.aziende || []);
    arr.forEach(a => {
      const p = rv2Point(a, allowApprox);
      if(!p) return;
      const km = rv2DistKm(pos, p);
      if(!best || km < best.km) best = {azienda:a, km, point:p};
    });
    return best;
  }
  function rv2GeoAddress(a){
    const addr = String((a && a.addr) || '').trim();
    if(!addr || addr.length < 4) return '';
    return /italia|italy/i.test(addr) ? addr : addr + ', Italia';
  }
  async function rv2GeocodeCompany(a){
    const text = rv2GeoAddress(a);
    if(!text) return null;
    db.geoCache = db.geoCache || {};
    const id = String(a.id);
    const cached = db.geoCache[id];
    if(cached && cached.text === text && rv2Finite(cached.lat) && rv2Finite(cached.lon)){
      return {lat:Number(cached.lat), lon:Number(cached.lon), source:'cache'};
    }
    if(!db.cfg || !db.cfg.orsKey || !window.fetch) return null;
    try{
      const url = 'https://api.openrouteservice.org/geocode/search?api_key=' + encodeURIComponent(db.cfg.orsKey) + '&text=' + encodeURIComponent(text) + '&boundary.country=IT&size=1';
      const res = await fetch(url, {cache:'force-cache'});
      if(!res.ok) return null;
      const data = await res.json();
      const coords = data && data.features && data.features[0] && data.features[0].geometry && data.features[0].geometry.coordinates;
      if(!coords || !rv2Finite(coords[1]) || !rv2Finite(coords[0])) return null;
      const point = {lat:Number(coords[1]), lon:Number(coords[0]), source:'geocode'};
      db.geoCache[id] = {lat:point.lat, lon:point.lon, text, updatedAt:new Date().toISOString()};
      a.lat = point.lat;
      a.lon = point.lon;
      a.geoText = text;
      return point;
    }catch(e){
      return null;
    }
  }
  function rv2SetStatus(text, type='gray'){
    const el = document.getElementById('geoStatus');
    if(!el) return;
    el.className = 'rvBadge ' + (type || 'gray');
    el.textContent = text || '';
  }
  function rv2ApplyCompany(a, km){
    const sel = document.getElementById('iAz');
    if(!sel || !a) return;
    if(window.rvManualAz) return;
    sel.value = String(a.id);
    const picker = document.getElementById('servPicker');
    if(picker) picker.innerHTML = servicePickerHTML('', Number(a.id), window.sel || {});
    rv2SetStatus('Vicino: ' + a.nome + (Number.isFinite(km) ? ' · ' + km.toFixed(1) + ' km' : ''), 'gray');
  }
  async function rv2RefineNearest(pos, approxHit){
    const all = (db.aziende || []).filter(a => rv2GeoAddress(a));
    if(!all.length) return;
    const approxList = all.map(a => ({a, p:rv2Point(a, true)})).filter(x => x.p).map(x => ({a:x.a, km:rv2DistKm(pos, x.p)})).sort((x,y)=>x.km-y.km);
    const limitKm = approxHit ? Math.max(8, approxHit.km + 18) : 30;
    const candidates = approxList.filter(x => x.km <= limitKm).slice(0, 18).map(x => x.a);
    if(!candidates.length) return;
    const resolved = [];
    for(const a of candidates){
      if(window.rvManualAz) return;
      const p = await rv2GeocodeCompany(a);
      if(p) resolved.push({a, p});
    }
    if(!resolved.length || window.rvManualAz) return;
    let best = null;
    resolved.forEach(x => {
      const km = rv2DistKm(pos, x.p);
      if(!best || km < best.km) best = {azienda:x.a, km, point:x.p};
    });
    if(best) {
      rv2ApplyCompany(best.azienda, best.km);
      try{ saveCloud(); }catch(e){}
    }
  }
  function rv2AutoNearestCompany(){
    if(!current || current.role === 'company') return;
    if(!navigator.geolocation){ rv2SetStatus('Posizione non disponibile', 'warn'); return; }
    rv2SetStatus('Posizione...', 'gray');
    navigator.geolocation.getCurrentPosition(
      pos => {
        const p = {lat:pos.coords.latitude, lon:pos.coords.longitude};
        const hit = rv2Nearest(p, true);
        if(hit) rv2ApplyCompany(hit.azienda, hit.km);
        else rv2SetStatus('Nessuna azienda localizzata', 'warn');
        rv2RefineNearest(p, hit);
      },
      () => rv2SetStatus('Posizione non attiva', 'warn'),
      {enableHighAccuracy:true, timeout:9000, maximumAge:180000}
    );
  }
  window.rvAutoNearestCompany = rv2AutoNearestCompany;
  window.openIntervento = function openIntervento(dateOverride){
    if(current.role === 'company') return;
    window.sel = {};
    window.rvManualAz = false;
    const chosenDate = dateOverride || ((tab === 'storico' && window.stDay) ? window.stDay : iso());
    const aziende = rv2CompanySort();
    const firstAz = aziende[0] ? aziende[0].id : 0;
    const opts = aziende.map(a => `<option value="${a.id}" ${a.id===firstAz?'selected':''}>${rv2Esc(a.nome)}</option>`).join('');
    $('sheet').innerHTML = `<div class="titleRow"><div class="h">Nuovo intervento</div><button class="btn secondary" onclick="closeModal()">Chiudi</button></div><div class="formGrid"><div><div class="rvGeoLine"><div class="label">Azienda</div><span id="geoStatus" class="rvBadge gray">Posizione...</span></div><select id="iAz" class="input" onchange="window.rvManualAz=true;document.getElementById('servPicker').innerHTML=servicePickerHTML('',Number(this.value),window.sel)">${opts}</select></div><div class="grid2"><div><div class="label">Data</div><input id="iData" class="input" type="date" value="${chosenDate}"></div><div><div class="label">Ora</div><input id="iOra" class="input" type="time" value="${new Date().toTimeString().slice(0,5)}"></div></div><div><div class="label">Sessione</div><select id="iSess" class="input"><option value="m" ${defaultSession()==='m'?'selected':''}>Mattina</option><option value="p" ${defaultSession()==='p'?'selected':''}>Pomeriggio</option><option value="n" ${defaultSession()==='n'?'selected':''}>Notte / Urgenza</option></select></div><div><div class="label">Prestazioni, farmaci e fiale</div><div id="servPicker">${servicePickerHTML('', firstAz, window.sel)}</div></div><div><div class="label">Note</div><textarea id="iNote" class="input"></textarea></div><div class="rvQuickBar"><button class="btn" onclick="saveIntervento()">Salva intervento</button><button class="btn secondary" onclick="closeModal()">Annulla</button></div></div>`;
    openModal();
    setTimeout(rv2AutoNearestCompany, 120);
  };
})();
</script>

<script id="rv-wow-script">
(() => {
  if (window.__rvWowPatch) return;
  window.__rvWowPatch = true;
  const all = (sel, root=document) => Array.prototype.slice.call((root || document).querySelectorAll(sel));
  let raf = 0;
  function decorate(root=document){
    const scope = root && root.querySelectorAll ? root : document;
    all('.page.on .stat,.page.on .card,.page.on .calCard,.page.on .backupCard,.sheet .card,.sheet .svc,.sheet .rvCatChip', scope).forEach((el, i) => {
      el.style.setProperty('--rv-i', String(Math.min(i, 30)));
    });
    all('.svc', scope).forEach(el => {
      const q = el.querySelector('.q');
      const n = Number(q && q.textContent || 0);
      el.classList.toggle('rvSelectedSvc', n > 0);
    });
    const app = document.getElementById('app');
    document.body.classList.toggle('rvLoggedIn', !!(app && getComputedStyle(app).display !== 'none'));
  }
  function schedule(){
    if (raf) return;
    raf = requestAnimationFrame(() => { raf = 0; decorate(document); });
  }
  const mo = new MutationObserver(schedule);
  mo.observe(document.body, {childList:true, subtree:true, characterData:true});
  ['go','openModal','closeModal','setupUser','renderProfiles','rOggi','rAziende','rDash','rFatture','rStorico','rImpost','chg','chge','rvSetCat','rvFilterServices','openIntervento','editIntervento'].forEach(name => {
    const fn = window[name];
    if (typeof fn === 'function' && !fn.__rvWowWrapped) {
      window[name] = function(){
        const out = fn.apply(this, arguments);
        schedule();
        return out;
      };
      window[name].__rvWowWrapped = true;
    }
  });
  document.addEventListener('click', e => {
    const el = e.target.closest('button,.prof,.svc');
    if (!el) return;
    el.classList.remove('rvTap');
    void el.offsetWidth;
    el.classList.add('rvTap');
    setTimeout(() => el.classList.remove('rvTap'), 460);
  }, true);
  document.addEventListener('input', schedule, true);
  window.addEventListener('load', schedule);
  schedule();
})();
</script>

<script id="rv-titlecase-garamond-script">
(() => {
  if (window.__rvTitleCaseGaramondPatch) return;
  window.__rvTitleCaseGaramondPatch = true;
  const SKIP = 'script,style,noscript,template,code,pre,kbd,samp';
  const ATTRS = ['placeholder','aria-label','title','alt'];
  const HAS_LETTERS = /[A-Za-zÀ-ÖØ-öø-ÿ]/;
  let WORD_RE;
  try { WORD_RE = new RegExp('\\p{L}[\\p{L}\\p{M}]*','gu'); }
  catch(e) { WORD_RE = /[A-Za-zÀ-ÖØ-öø-ÿ]+/g; }
  function titleWord(word){
    const chars = Array.from(word);
    return chars.length ? chars[0].toLocaleUpperCase('it-IT') + chars.slice(1).join('') : word;
  }
  function toTitleCase(value){
    const text = String(value ?? '');
    if (!HAS_LETTERS.test(text)) return text;
    return text.toLocaleLowerCase('it-IT').replace(WORD_RE, titleWord);
  }
  function blocked(el){return !el || el.isContentEditable || !!el.closest(SKIP)}
  function fixText(node){
    if (!node || node.nodeType !== 3 || blocked(node.parentElement)) return;
    const next = toTitleCase(node.nodeValue);
    if (next !== node.nodeValue) node.nodeValue = next;
  }
  function fixAttrs(el){
    if (!el || el.nodeType !== 1 || blocked(el)) return;
    for (const attr of ATTRS){
      if (!el.hasAttribute(attr)) continue;
      const current = el.getAttribute(attr);
      const next = toTitleCase(current);
      if (next !== current) el.setAttribute(attr, next);
    }
  }
  function fixTree(root){
    if (!root) return;
    if (root.nodeType === 3){fixText(root);return}
    if (root.nodeType !== 1 || blocked(root)) return;
    fixAttrs(root);
    if (root.querySelectorAll) root.querySelectorAll('*').forEach(fixAttrs);
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode(node){return blocked(node.parentElement) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT}});
    let node;
    while ((node = walker.nextNode())) fixText(node);
  }
  const queue = new Set();
  let raf = 0;
  function schedule(node){
    queue.add(node || document.body);
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      const items = Array.from(queue);
      queue.clear();
      items.forEach(fixTree);
      document.title = toTitleCase(document.title || 'Rural Vet');
    });
  }
  function start(){
    if (!document.body){document.addEventListener('DOMContentLoaded', start, {once:true});return}
    fixTree(document.body);
    document.title = toTitleCase(document.title || 'Rural Vet');
    const observer = new MutationObserver(mutations => {
      for (const mutation of mutations){
        if (mutation.type === 'characterData') schedule(mutation.target);
        else mutation.addedNodes.forEach(schedule);
      }
    });
    observer.observe(document.body, {childList:true, subtree:true, characterData:true});
    window.rvTitleCase = toTitleCase;
  }
  start();
})();
</script>

    let ctx = conversationUserText(originalText || '');
    let ocr = '';
    if (pendingImage) {
      ocr = await ocrPendingImage();
      if (ocr) ctx += '\n\nTesto estratto dalla foto:\n' + ocr;
    }
    typingText('Ragiono come in chat...');
    const f = extractFacts(ctx);
    const candidates = diagnose(ctx, f);
    const notes = relevantNotes(ctx);
    let sources = [];
    if (getSettings().useWeb !== false && (asksForSources(ctx) || pendingImage)) {
      try { sources = await withTimeout(webResearch(ctx), asksForSources(ctx) ? 6500 : 3000); } catch(e) { sources = []; }
    }
    return buildBasicAnswer(ctx, f, candidates, notes, sources, ocr, backendErr);
  }
  async function smartReply(text){
    lastAiChart = null;
    lastAiInsights = [];

    s.endpoint = normalizeEndpoint(s.endpoint);
    saveSettings({endpoint:s.endpoint});
    if (!s.endpoint) {
      return 'Rural Vet AI non è ancora collegata al backend. Inserisci l’endpoint in Appunti > Endpoint backend Rural Vet AI. Non rispondo con il motore locale per evitare risposte sbagliate.';
    }
    try {
      typingText('Consulto backend e dati gestionali...');
      return await callBackend(text);
    } catch(e) {
      return 'Backend Rural Vet AI non disponibile: non rispondo a caso. Controlla Render, endpoint e API key. Dettaglio: ' + (e && e.message ? e.message : e);
    }
  }

  function readFileData(file){ return new Promise((resolve,reject) => { const r = new FileReader(); r.onload = () => resolve(String(r.result || '')); r.onerror = () => reject(r.error || new Error('File non leggibile')); r.readAsDataURL(file); }); }
  function readFileText(file){ return new Promise((resolve,reject) => { const r = new FileReader(); r.onload = () => resolve(String(r.result || '')); r.onerror = () => reject(r.error || new Error('File non leggibile')); r.readAsText(file); }); }
  function downscale(dataUrl, mime){
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const max = 1600; let w = img.width, h = img.height;
        if (Math.max(w,h) > max) { const k = max / Math.max(w,h); w = Math.round(w * k); h = Math.round(h * k); }
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const x = c.getContext('2d'); x.drawImage(img,0,0,w,h);
        resolve(c.toDataURL(mime && mime.indexOf('png') >= 0 ? 'image/png' : 'image/jpeg', .84));
      };
      img.onerror = () => resolve(dataUrl); img.src = dataUrl;
    });
  }

  function backendBase(endpoint){ return normalizeEndpoint(endpoint).replace(/\/api\/vet-ai-chat\/?$/,''); }
  function warmBackend(){
    const ep = getSettings().endpoint;
    if (!ep) return Promise.resolve(false);
    const base = backendBase(ep);
    if (!base) return Promise.resolve(false);
    if (!backendWarmPromise) backendWarmPromise = fetch(base + '/api/health', {cache:'no-store'}).then(r => r.ok).catch(() => false).finally(() => { setTimeout(() => { backendWarmPromise = null; }, 15000); });
    return backendWarmPromise;
  }
  function stopVoiceLoop(message){
    rvAiVoiceLoop = false;
    if (rvAiVoiceRestartTimer) { clearTimeout(rvAiVoiceRestartTimer); rvAiVoiceRestartTimer = null; }
    if (rvAiRecognition) { try { rvAiRecognition.stop(); } catch(e){} }
    const btn = $('rvAiMicBtn');
    if (btn) { btn.classList.remove('on'); btn.textContent = '🎙️'; btn.title = 'Avvia conversazione vocale'; }
    if (message) addMsg('system', message);
  }
  function scheduleVoiceRestart(){
    if (!rvAiVoiceLoop || rvAiListening) return;
    const o = $('rvAiChat'); if (!o || o.classList.contains('hidden')) return;
    if (rvAiVoiceRestartTimer) clearTimeout(rvAiVoiceRestartTimer);
    rvAiVoiceRestartTimer = setTimeout(() => { if (rvAiVoiceLoop && !busy && !rvAiListening) startVoiceRecognition(true); }, 650);
  }
  function startVoiceRecognition(auto){
    ensureShell();
    const Rec = speechApi();
    if (!Rec) { stopVoiceLoop(); addMsg('system','Il browser non supporta la dettatura. Usa Chrome o Safari e autorizza il microfono.'); return; }
    if (rvAiListening && rvAiRecognition) { try { rvAiRecognition.stop(); } catch(e){} return; }
    const btn = $('rvAiMicBtn');
    rvAiRecognition = new Rec();
    rvAiRecognition.lang = 'it-IT';
    rvAiRecognition.interimResults = true;
    rvAiRecognition.continuous = false;
    let finalText = '';
    rvAiRecognition.onstart = () => { rvAiListening = true; if (btn) { btn.classList.add('on'); btn.textContent = '●'; btn.title = 'Ascolto attivo: tocca per fermare'; } };
    rvAiRecognition.onend = () => {
      rvAiListening = false;
      if (btn) { btn.classList.toggle('on', rvAiVoiceLoop); btn.textContent = rvAiVoiceLoop ? '●' : '🎙️'; }
      const input = $('rvAiInput');
      const spoken = input && input.value ? input.value.trim() : finalText.trim();
      if (rvAiVoiceLoop && spoken && !busy) {
        setTimeout(() => { const i = $('rvAiInput'); if (rvAiVoiceLoop && i && i.value.trim() && !busy) window.rvAiSend(); }, 160);
      } else if (rvAiVoiceLoop && !spoken && !busy) scheduleVoiceRestart();
    };
    rvAiRecognition.onerror = (ev) => {
      rvAiListening = false;
      const err = ev && ev.error ? ev.error : '';
      if (err === 'not-allowed' || err === 'service-not-allowed') { stopVoiceLoop(); addMsg('system','Microfono non autorizzato. Consenti il microfono nel browser.'); }
      else if (rvAiVoiceLoop) scheduleVoiceRestart();
      else addMsg('system','Non riesco ad ascoltare. Controlla il permesso microfono del browser.');
    };
    rvAiRecognition.onresult = (ev) => {
      let interim = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const txt = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) finalText += txt + ' '; else interim += txt;
      }
      const input = $('rvAiInput');
      if (input) { input.value = (finalText + interim).trim(); autoGrow(input); }
    };
    try { rvAiRecognition.start(); } catch(e){ if (rvAiVoiceLoop) scheduleVoiceRestart(); }
  }
  window.rvAiToggleMic = function(){
    ensureShell();
    if (rvAiVoiceLoop || rvAiListening) { stopVoiceLoop('Conversazione vocale fermata.'); return; }
    rvAiVoiceLoop = true;
    addMsg('system','Conversazione vocale attiva. Parla: invierò automaticamente ciò che dici. Tocca di nuovo il microfono o di’ “fine” per fermare.');
    startVoiceRecognition(true);
  };

  window.rvAiOpen = function(){ ensureShell(); loadHistory(); renderMessages(); renderSide(false); warmBackend(); const o = $('rvAiChat'); o.classList.remove('hidden'); o.setAttribute('aria-hidden','false'); setTimeout(() => { const i = $('rvAiInput'); if (i) i.focus(); }, 60); };
  window.rvAiClose = function(){ const o = $('rvAiChat'); if (o) { o.classList.add('hidden'); o.setAttribute('aria-hidden','true'); } };
  window.rvAiOpenSettings = function(){ ensureShell(); renderSide(true); };
  window.rvAiCloseSettings = function(){ renderSide(false); const i = $('rvAiInput'); if (i) setTimeout(() => i.focus(), 40); };
  window.rvAiSaveSettings = function(){
    const endpoint = $('rvAiEndpoint') ? $('rvAiEndpoint').value.trim() : getSettings().endpoint;
    const style = $('rvAiStyle') ? $('rvAiStyle').value.trim() : getSettings().style;
    const knowledge = $('rvAiKnowledge') ? $('rvAiKnowledge').value.trim() : getSettings().knowledge;
    const useWeb = $('rvAiUseWeb') ? $('rvAiUseWeb').checked : getSettings().useWeb;
    saveSettings({endpoint:endpoint, style:style, knowledge:knowledge, useWeb:useWeb});
    addMsg('system','Salvato. Rural Vet AI userà questi appunti nelle prossime risposte.');
    warmBackend();
    renderSide(false);
  };
  window.rvAiNewChat = function(){ messages = [greetingObject()]; pendingImage = null; saveHistory(); renderMessages(); renderSide(false); window.rvAiRemoveImage(); const input = $('rvAiInput'); if (input) { input.value = ''; autoGrow(input); input.focus(); } };
  window.rvAiPickImage = function(){ ensureShell(); const f = $('rvAiFile'); if (f) f.click(); };
  window.rvAiUploadNotes = function(){ ensureShell(); const f = $('rvAiNotesFile'); if (f) f.click(); };
  window.rvAiClearKnowledge = function(){ if (!confirm('Vuoi svuotare appunti e protocolli salvati per Rural Vet AI?')) return; saveSettings({knowledge:defaultSettings().knowledge}); renderSide(true); addMsg('system','Appunti Rural Vet AI riportati al testo base.'); };
  window.rvAiRemoveImage = function(){ pendingImage = null; const p = $('rvAiPreview'); if (p) p.classList.remove('on'); };
  window.rvAiHandleFile = async function(file){
    if (!file) return;
    if (!/^image\//.test(file.type || '')) { addMsg('system','Carica una immagine del referto.'); return; }
    try {
      const raw = await readFileData(file);
      const dataUrl = await downscale(raw, file.type || 'image/jpeg');
      pendingImage = {name:file.name || 'foto-referto.jpg', mime:file.type || 'image/jpeg', dataUrl:dataUrl};
      const img = $('rvAiPreviewImg'), name = $('rvAiPreviewName'), p = $('rvAiPreview');
      if (img) img.src = dataUrl; if (name) name.textContent = pendingImage.name; if (p) p.classList.add('on');
    } catch(e){ addMsg('system','Non riesco a leggere la foto selezionata.'); }
  };
  window.rvAiHandleNotes = async function(files){
    files = Array.from(files || []);
    if (!files.length) return;
    const accepted = [];
    const refused = [];
    for (const file of files) {
      const name = file.name || 'appunti.txt';
      if (Number(file.size || 0) > 2500000) { refused.push(name + ' troppo grande'); continue; }
      if (/\.(pdf|docx?|xlsx?|pages)$/i.test(name)) { refused.push(name); continue; }
      try {
        let txt = await readFileText(file);
        txt = txt.replace(/\u0000/g,'').trim();
        if (txt.length > 60000) txt = txt.slice(0,60000) + '\n[File tagliato: troppo lungo per modalita base]';
        if (txt) accepted.push('Appunti da ' + name + ':\n' + txt);
      } catch(e) { refused.push(name); }
    }
    if (accepted.length) {
      const s = getSettings();
      const next = (s.knowledge ? s.knowledge.trim() + '\n\n' : '') + accepted.join('\n\n');
      saveSettings({knowledge:next});
      renderSide(false);
      addMsg('system','Appunti caricati: ' + accepted.length + ' file. Li userò nelle risposte.');
    }
    if (refused.length) addMsg('system','Non importati in modalità base: ' + refused.join(', ') + '. Copia il testo negli appunti Rural Vet AI oppure colleghiamo un backend per PDF/DOCX.');
  };
  window.rvAiSend = async function(){
    ensureShell(); if (busy) return;
    const input = $('rvAiInput');
    const text = (input && input.value ? input.value.trim() : '');
    if (!text && !pendingImage) return;
    const label = text || 'Analizza la foto/referto allegato e dimmi diagnosi probabile e cosa controllare.';
    addMsg('user', label + (pendingImage ? '\n[Foto allegata: ' + pendingImage.name + ']' : ''));
    if (input) { input.value = ''; autoGrow(input); }
    if (/^\s*(fine|stop|basta|chiudi conversazione|termina)\s*\.?$/i.test(text)) { stopVoiceLoop('Conversazione vocale conclusa.'); window.rvAiRemoveImage(); return; }
    if (isCancelCommand(text)) { window.rvAiRemoveImage(); clearPendingActions(); return; }
    if (pendingInterventionDraft && !isSaveCommand(text)) { setBusy(true); typing(true, 'Continuo la bozza intervento...'); try { lastQuickReplies = []; const reply = await smartReply(label); typing(false); addMsg('bot', reply, mergeQuickReplies(lastQuickReplies, defaultQuickReplies()), lastAiChart); } catch(e){ typing(false); addMsg('bot','Non riesco a continuare la bozza. Dettaglio: ' + (e && e.message ? e.message : e)); } finally { window.rvAiRemoveImage(); setBusy(false); } return; }
    if (pendingChoiceAction && handleChoiceAnswer(text)) { window.rvAiRemoveImage(); return; }
    if (pendingAiAction && actionNeedsWhen(pendingAiAction) && handlePendingWhenAnswer(text)) { window.rvAiRemoveImage(); return; }
    if (isDeleteConfirmCommand(text) && pendingDeleteAction) { window.rvAiRemoveImage(); savePendingDeleteAction(); return; }
    if (isDeleteConfirmCommand(text) && pendingMgmtAction && mgmtNeedsDeleteConfirm(pendingMgmtAction)) { window.rvAiRemoveImage(); savePendingMgmtAction(true); return; }
    if (isSaveCommand(text)) { window.rvAiRemoveImage(); if (pendingInterventionDraft && pendingInterventionDraft.awaiting !== 'confirm') { setBusy(true); typing(true, 'Completo la bozza...'); try { lastQuickReplies = []; const reply = await smartReply(text); typing(false); addMsg('bot', reply, mergeQuickReplies(lastQuickReplies, defaultQuickReplies()), lastAiChart); } catch(e){ typing(false); addMsg('bot','Non riesco a completare la bozza.'); } finally { setBusy(false); } return; } if (pendingInterventionDraft && pendingInterventionDraft.awaiting === 'confirm' && !pendingAiAction) { setBusy(true); typing(true, 'Preparo il salvataggio...'); try { lastQuickReplies = []; await smartReply(text); } catch(e){ typing(false); addMsg('bot','Non riesco a preparare il salvataggio della bozza.'); setBusy(false); return; } typing(false); setBusy(false); } if (pendingClientAction) savePendingClientAction(); else if (pendingMgmtAction) savePendingMgmtAction(false); else savePendingAiAction(); return; }
    if (maybeLearn(text)) { window.rvAiRemoveImage(); return; }
    if (handleClientCreation(text)) { window.rvAiRemoveImage(); return; }
    // Backend-first: i nuovi comandi passano sempre dal backend Rural Vet AI prima di rispondere.
    setBusy(true); typing(true, 'Consulto Rural Vet AI...');
    try { lastQuickReplies = []; const reply = await smartReply(label); typing(false); addMsg('bot', reply, mergeQuickReplies(lastQuickReplies, defaultQuickReplies()), lastAiChart); }
    catch(e) { typing(false); addMsg('bot','Non riesco a completare la risposta. Dimmi il caso in una riga con animale, sintomo, temperatura e durata. Dettaglio tecnico: ' + (e && e.message ? e.message : e)); }
    finally { window.rvAiRemoveImage(); setBusy(false); }
  };

  function injectHomeButton(){
    const page = $('p-oggi');
    if (!page || page.querySelector('#rvAiHomeCard')) return;
    const card = document.createElement('div');
    card.id = 'rvAiHomeCard'; card.className = 'card';
    card.innerHTML = '<div class="rvAiHomeGrid"><div><div class="rvAiTitle">Rural Vet AI</div><div class="small">KPI, grafici e interventi guidati.</div></div><div class="rvAiHomeActions"><button class="rvAiOpenBtn" type="button" onclick="rvAiOpen()">Apri Rural Vet AI</button><button class="rvAiGhostBtn" type="button" onclick="rvAiOpen();setTimeout(rvAiPickImage,120)">Foto referto</button></div></div>';
    const title = page.querySelector('.titleRow');
    if (title && title.parentNode) title.parentNode.insertBefore(card, title.nextSibling); else page.insertBefore(card, page.firstChild);
  }

  const origROggi = window.rOggi;
  if (typeof origROggi === 'function') window.rOggi = function(){ const out = origROggi.apply(this, arguments); setTimeout(injectHomeButton, 0); return out; };

  setTimeout(injectHomeButton, 250);
})();

    data = (Array.isArray(data) ? data : []).filter(d => Number(d && d.val) > 0);
    const cols=['#12301a','#1f5a30','#39a05b','#9bbf77','#d0a94f'];
    if(!data.length) return '<svg viewBox="0 0 100 100"></svg>';
    const sum=data.reduce((s,d)=>s+Number(d.val||0),0)||1;
    if(data.length===1 || Number(data[0].val||0)/sum >= 0.999999){
      return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="${cols[0]}" stroke="#fff" stroke-width="2"></circle></svg>`;

    let ang=-Math.PI/2, paths='';

      if(sw <= 0) return;
      let x1=50+42*Math.cos(ang), y1=50+42*Math.sin(ang);
      let x2=50+42*Math.cos(ang+sw), y2=50+42*Math.sin(ang+sw);
      paths+=`<path d="M50,50 L${x1},${y1} A42,42 0 ${sw>Math.PI?1:0},1 ${x2},${y2} Z" fill="${cols[i%cols.length]}" stroke="#fff" stroke-width="2"></path>`;

<script id="rvKmDashFix20260522">
(() => {
  function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
  function safeFmt(d){try{return fmt(d)}catch(e){return d||''}}
  function cleanRouteText(s, home){
    if(s.sessionStart) return esc(s.to || home || 'Casa');
    let from = String(s.from || '').trim();
    let to = String(s.to || '').trim();
    if(from === 'Ultima azienda') return 'Ultima azienda &rarr; ' + esc(to || 'Casa');
    if(!from) return esc(to || 'Spostamento');
    if(from.length > 46) from = 'Tappa precedente';
    return esc(from) + ' &rarr; ' + esc(to || 'Arrivo');
  }
  function stopSub(s){
    const pieces=[];
    if(s.ora) pieces.push(esc(s.ora));
    if(s.from && s.from !== 'Ultima azienda' && String(s.from).length > 46) pieces.push('da: '+esc(s.from));
    return pieces.join(' · ');
  }
  function sessionNameFromStop(s){
    const txt=String(s.ora||'');
    if(/mattina/i.test(txt)) return 'Mattina';
    if(/pomeriggio/i.test(txt)) return 'Pomeriggio';
    if(/notte|urgenza/i.test(txt)) return 'Notte / urgenza';
    if(s.sess && typeof sessionLabel === 'function') return sessionLabel(s.sess);
    return 'Sessione';
  }
  function renderKmRoute(stops, home){
    if(!stops || !stops.length) return '<div class="empty">Nessuno spostamento</div>';
    let html='', step=0;
    stops.forEach(s=>{
      if(s.sessionStart){
        html += '<div class="rvKmSession">' + esc(sessionNameFromStop(s)) + '</div>';
        html += '<div class="rvKmStep rvKmStart"><div class="rvKmStepNum">0</div><div><div class="rvKmRouteMain">Partenza da ' + esc(s.to || home || 'Casa') + '</div><div class="rvKmRouteSub">' + esc(s.ora || '') + '</div></div><div class="rvKmDist">Start</div></div>';
        return;
      }
      step += 1;
      html += '<div class="rvKmStep"><div class="rvKmStepNum">' + step + '</div><div><div class="rvKmRouteMain">' + cleanRouteText(s, home) + '</div><div class="rvKmRouteSub">' + stopSub(s) + '</div></div><div class="rvKmDist">' + (Number(s.km||0).toFixed(1)) + ' km</div></div>';
    });
    return html;
  }
  window.rKm = function rKm(){
    if(current.role !== 'company' && typeof rvHasKm === 'function' && !rvHasKm(current.id)) return go('oggi');
    let visibleInts = current.role === 'company' ? db.int : scopeInts();
    let days = [...new Set((visibleInts||[]).map(i=>i.data))].sort().reverse();
    let sel = window.kmDay || days[0] || iso();
    window.kmDay = sel;
    let users = current.role === 'company' ? (typeof rvWorkersKm === 'function' ? rvWorkersKm() : workers()) : [current];
    $('p-km').innerHTML = '<div class="titleRow"><div><div class="h">Rimborsi Km</div></div></div><div class="selectLine"><input class="input" type="date" value="'+esc(sel)+'" onchange="window.kmDay=this.value;rKm()"></div><div class="card"><div class="name">Calcolo percorsi...</div><div class="small">Sto preparando le tappe della giornata e i km per ogni spostamento.</div></div>';
    Promise.all(users.map(u=>routeForAsync(sel,u.id).then(r=>({u,r})))).then(results=>{
      let total=0, rimb=0, segments=0;
      results.forEach(({u,r})=>{ total += Number(r.total||0); rimb += Number(r.total||0)*kmRate(u.id); segments += (r.stops||[]).filter(s=>!s.sessionStart).length; });
      let top = '<div class="titleRow"><div><div class="h">Rimborsi Km</div></div></div>'+
        '<div class="selectLine"><input class="input" type="date" value="'+esc(sel)+'" onchange="window.kmDay=this.value;rKm()"></div>'+
        '<div class="rvKmHero"><div class="small">Dettaglio spostamenti del '+esc(safeFmt(sel))+'</div><div class="rvKmHeroTitle">'+total.toFixed(1)+' km</div><div class="rvKmHeroGrid"><div class="rvKmMini"><b>'+eur(rimb)+'</b><span>Rimborso totale</span></div><div class="rvKmMini"><b>'+segments+'</b><span>Spostamenti</span></div><div class="rvKmMini"><b>'+users.length+'</b><span>Profili con km</span></div></div></div>'+
        '<div class="helpBox">Ogni blocco mostra la sequenza reale della giornata: partenza, trasferimenti tra aziende e rientri. Se OpenRouteService non trova un indirizzo, viene usato il km fallback dell\'azienda.</div>';
      let body = results.map(({u,r})=>{
        const km = Number(r.total||0), rim = km*kmRate(u.id), home = homeLabel(u.id), n=(r.stops||[]).filter(s=>!s.sessionStart).length;
        return '<div class="card rvKmUserCard"><div class="rvKmUserHead"><div><div class="rvKmUserTitle">'+esc(u.name)+'</div><div class="rvKmUserMeta">Casa: '+esc(home)+'</div></div><div class="rvKmUserTotals"><span class="rvKmPill dark">'+km.toFixed(1)+' km</span><span class="rvKmPill amb">'+eur(kmRate(u.id))+'/km</span><span class="rvKmPill">'+eur(rim)+'</span><span class="rvKmPill">'+n+' tratte</span></div></div><div class="rvKmRoute">'+renderKmRoute(r.stops, home)+'</div></div>';
      }).join('');
      $('p-km').innerHTML = top + (body || '<div class="empty">Nessuno spostamento</div>');
      saveCloud();
    }).catch(err=>{
      $('p-km').innerHTML = '<div class="titleRow"><div><div class="h">Rimborsi Km</div></div></div><div class="card"><div class="name">Errore calcolo km</div><div class="small">'+esc(err && err.message ? err.message : 'Errore non specificato')+'</div></div>';
    });
  };
})();

<script id="rv-cloud-proxy-patch-v89">
/* v8.9 — Sync cloud tramite backend Rural Vet AI.
   La master key JSONBin non deve più vivere nell'HTML: il salvataggio e il
   caricamento passano dal backend (/api/db/save, /api/db/load) che tiene la
   chiave in variabili ambiente. Se il backend non è configurato, si torna in
   automatico al vecchio canale diretto (SYNC) così nulla si rompe oggi.
   Riusa le funzioni già esistenti: rvEnsureMeta, saveLocalCopy, loadLocalCopy,
   mergeCloudRecord, setSaveState, RV_SAVE, migrate. */
(function(){
  'use strict';
  function backendBase(){
    try {
      var ep = (window.RV_AI_ENDPOINT || 'https://rural-vet-ai.onrender.com/api/vet-ai-chat');
      try { var raw = localStorage.getItem('manual-rural-vet-ai'); if (raw) { var s = JSON.parse(raw); if (s && s.endpoint) ep = s.endpoint; } } catch(e){}
      return String(ep).replace(/\/api\/.*$/, '');
    } catch(e){ return ''; }
  }
  var RV_CLOUD = { mode: null, checking: null };
  function detectMode(){
    if (RV_CLOUD.mode) return Promise.resolve(RV_CLOUD.mode);
    if (RV_CLOUD.checking) return RV_CLOUD.checking;
    var base = backendBase();
    if (!base) { RV_CLOUD.mode = 'direct'; return Promise.resolve('direct'); }
    RV_CLOUD.checking = fetch(base + '/api/db/ping', { method:'GET' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ RV_CLOUD.mode = (j && j.ok && j.configured) ? 'backend' : 'direct'; return RV_CLOUD.mode; })
      .catch(function(){ RV_CLOUD.mode = 'direct'; return 'direct'; })
      .finally(function(){ RV_CLOUD.checking = null; });
    return RV_CLOUD.checking;
  }
  function directConfigured(){ return !!(typeof SYNC !== 'undefined' && SYNC && SYNC.binId && SYNC.apiKey); }
  function cloudGetLatest(){
    return detectMode().then(function(mode){
      if (mode === 'backend') {
        return fetch(backendBase() + '/api/db/load').then(function(r){
          if (!r.ok) throw new Error('cloud latest ' + r.status);
          return r.json();
        });
      }
      if (!directConfigured()) throw new Error('cloud non configurato');
      return fetch('https://api.jsonbin.io/v3/b/' + SYNC.binId + '/latest', { headers:{ 'X-Master-Key': SYNC.apiKey } }).then(function(r){
        if (!r.ok) throw new Error('cloud latest ' + r.status);
        return r.json();
      });
    });
  }
  function cloudPutDb(dbObj){
    return detectMode().then(function(mode){
      if (mode === 'backend') {
        return fetch(backendBase() + '/api/db/save', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ db: dbObj }) }).then(function(r){
          if (!r.ok) throw new Error('cloud put ' + r.status);
          return r.json().catch(function(){ return {}; });
        });
      }
      if (!directConfigured()) throw new Error('cloud non configurato');
      return fetch('https://api.jsonbin.io/v3/b/' + SYNC.binId, { method:'PUT', headers:{ 'Content-Type':'application/json', 'X-Master-Key': SYNC.apiKey }, body: JSON.stringify(dbObj) }).then(function(r){
        if (!r.ok) throw new Error('cloud put ' + r.status);
        return r.json().catch(function(){ return {}; });
      });
    });
  }
  function anyCloudAvailable(){ return RV_CLOUD.mode === 'backend' || directConfigured(); }

  window.saveCloud = function saveCloud(){
    rvEnsureMeta();
    rvStampChanged();               /* marca i record modificati PRIMA di aggiornare lo snapshot */
    saveLocalCopy('pre-cloud-save');
    if (RV_SAVE.saving) { RV_SAVE.dirty = true; setSaveState('Salvataggio in coda…','var(--amb)'); return Promise.resolve(false); }
    RV_SAVE.saving = true;
    setSaveState('Salvataggio…','var(--amb)');
    return detectMode().then(function(){
      if (!anyCloudAvailable()) { throw new Error('cloud non configurato'); }
      return cloudGetLatest();
    }).then(function(j){
      if (j && j.record) mergeCloudRecord(j.record);
      rvEnsureMeta();
      db.meta.lastSavedAt = rvNow();
      return cloudPutDb(db);
    }).then(function(){
      RV_SAVE.saving = false; RV_SAVE.lastError = null;
      saveLocalCopy('cloud-saved');
      var tm = new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
      setSaveState('✓ Salvato ' + tm + (RV_CLOUD.mode === 'backend' ? '' : ' (canale diretto)'), 'var(--g2)');
      if (RV_SAVE.dirty) { RV_SAVE.dirty = false; return window.saveCloud(); }
      return true;
    }).catch(function(err){
      RV_SAVE.saving = false; RV_SAVE.lastError = err;
      saveLocalCopy('cloud-error-local-copy');
      setSaveState(String(err && err.message).indexOf('configurato') >= 0 ? '⚠ Cloud non configurato' : '⚠ Non salvato in cloud', 'var(--red)');
      console.error('RuralVet save error', err);
      return false;
    });
  };

  window.loadCloud = function loadCloud(cb){
    setSaveState('Caricamento cloud…','var(--amb)');
    detectMode().then(function(){
      if (!anyCloudAvailable()) throw new Error('cloud non configurato');
      return cloudGetLatest();
    }).then(function(j){
      if (j && j.record && j.record.aziende) {
        db = j.record; migrate(); saveLocalCopy('cloud-loaded');
        var when = db.meta && db.meta.lastSavedAt ? new Date(db.meta.lastSavedAt).toLocaleString('it-IT') : '';
        setSaveState('✓ Cloud caricato' + (when ? ' · ' + when : '') + (RV_CLOUD.mode === 'backend' ? '' : ' (canale diretto)'), 'var(--g2)');
      }
      cb && cb();
    }).catch(function(err){
      var loc = loadLocalCopy();
      if (loc && loc.db) { db = loc.db; migrate(); setSaveState('Offline · copia locale','var(--amb)'); }
      else { setSaveState('⚠ Cloud non raggiungibile','var(--red)'); }
      console.error('RuralVet load error', err);
      cb && cb();
    });
  };

  /* v8.9 — Merge multi-dispositivo con timestamp per record.
     Prima: a parità di id vinceva SEMPRE la copia locale, anche se non era
     stata toccata, sovrascrivendo in silenzio le modifiche fatte da un altro
     dispositivo. Ora: prima di ogni salvataggio marco updatedAt solo sui
     record davvero cambiati rispetto all'ultimo stato sincronizzato
     (snapshot 'cloud-saved'/'cloud-loaded' già esistente), e nel merge vince
     il record con updatedAt più recente. Se nessuno dei due ha il timestamp
     si mantiene il comportamento storico (vince il locale). */
  function rvRecNoStamp(r){ if (!r || typeof r !== 'object') return r; var c = {}; for (var k in r) { if (k !== 'updatedAt') c[k] = r[k]; } return c; }
  function rvSameRec(a, b){ try { return JSON.stringify(rvRecNoStamp(a)) === JSON.stringify(rvRecNoStamp(b)); } catch(e){ return false; } }
  function rvStampChanged(){
    try {
      var snap = loadLocalCopy();
      var base = snap && snap.db ? snap.db : null;
      var now = Date.now();
      ['aziende','prest','int','fatture'].forEach(function(key){
        var localArr = (db && db[key]) || [];
        var baseArr = (base && base[key]) || [];
        var baseMap = {};
        baseArr.forEach(function(r){ if (r && r.id !== undefined) baseMap[String(r.id)] = r; });
        localArr.forEach(function(r){
          if (!r || r.id === undefined) return;
          var prev = baseMap[String(r.id)];
          if (!prev) { if (!r.updatedAt) r.updatedAt = now; return; }   // nuovo record locale
          if (!rvSameRec(prev, r)) r.updatedAt = now;                    // modificato davvero
        });
      });
    } catch(e){ console.warn('rvStampChanged', e); }
  }
  window.mergeArr = function mergeArr(local, remote, tomb){
    var out = new Map();
    (remote || []).forEach(function(x){ if (x && x.id !== undefined && !(tomb && tomb[x.id])) out.set(String(x.id), x); });
    (local || []).forEach(function(x){
      if (!x || x.id === undefined) return;
      var key = String(x.id);
      var r = out.get(key);
      if (!r) { out.set(key, x); return; }
      var lt = Number(x.updatedAt) || 0, rt = Number(r.updatedAt) || 0;
      if (lt >= rt) out.set(key, x); // parità o nessun timestamp → comportamento storico (locale)
      // altrimenti tengo il remoto, più recente
    });
    return Array.from(out.values());
  };

  /* esposto solo per i test automatici */
  window.__rvSyncTest = { stampChanged: rvStampChanged, mergeArr: function(a,b,t){ return window.mergeArr(a,b,t); } };

  /* Guardia fatture: niente fatture vuote e niente doppia emissione da doppio click. */
  var prevEmitFatt = window.emitFatt;
  var emitBusy = false;
  if (typeof prevEmitFatt === 'function') {
    window.emitFatt = function emitFatt(aid){
      if (emitBusy) return;
      var arr = (db.int || []).filter(function(i){ return !i.fatt && i.allId == aid; });
      if (!arr.length) { alert('Nessun intervento da fatturare per questo cliente.'); return; }
      emitBusy = true;
      try { prevEmitFatt(aid); } finally { setTimeout(function(){ emitBusy = false; }, 1200); }
    };
  }
})();
</script>

<script id="rv-v810-ux-script">
/* v8.10 — Toast, annulla eliminazione, guardie doppio click, ESC sulle modali. */
(function(){
  'use strict';

  /* ---------- Toast ---------- */
  function toastHost(){
    var h = document.getElementById('rvToastHost');
    if (!h) { h = document.createElement('div'); h.id = 'rvToastHost'; document.body.appendChild(h); }
    return h;
  }
  window.rvToast = function(message, opts){
    opts = opts || {};
    try {
      var host = toastHost();
      var el = document.createElement('div');
      el.className = 'rvToast' + (opts.kind === 'error' ? ' err' : (opts.kind === 'ok' ? ' ok' : ''));
      el.setAttribute('role','status');
      el.setAttribute('aria-live','polite');
      var span = document.createElement('span');
      span.textContent = String(message || '');
      el.appendChild(span);
      var closed = false;
      function close(){ if (closed) return; closed = true; try { host.removeChild(el); } catch(e){} }
      if (opts.actionLabel && typeof opts.onAction === 'function') {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = opts.actionLabel;
        b.onclick = function(){ close(); try { opts.onAction(); } catch(e){ console.error(e); } };
        el.appendChild(b);
      }
      host.appendChild(el);
      setTimeout(close, Math.max(1500, Number(opts.ms) || 4500));
      return close;
    } catch(e){ console.warn('rvToast', e); }
  };

  /* ---------- Annulla eliminazione intervento (finestra di 6 secondi) ---------- */
  var prevDeleteIntervento = window.deleteIntervento;
  if (typeof prevDeleteIntervento === 'function') {
    window.deleteIntervento = function deleteIntervento(id){
      var rec = (db.int || []).find(function(x){ return x.id === id; });
      if (!rec || (typeof canManageIntervento === 'function' && !canManageIntervento(rec))) { alert('Non puoi eliminare questo intervento'); return; }
      if (!confirm('Eliminare intervento?')) return;
      var copy = JSON.parse(JSON.stringify(rec));
      rvEnsureMeta();
      db.deleted.int[String(id)] = Date.now();
      db.int = db.int.filter(function(x){ return x.id !== id; });
      saveCloud();
      if (tab === 'storico') { if (typeof rStorico === 'function') rStorico(); } else { if (typeof go === 'function') go('oggi'); }
      window.rvToast('Intervento eliminato.', {
        actionLabel: 'Annulla',
        ms: 6000,
        onAction: function(){
          try {
            rvEnsureMeta();
            delete db.deleted.int[String(id)];
            if (!(db.int || []).some(function(x){ return String(x.id) === String(id); })) db.int.push(copy);
            copy.updatedAt = Date.now(); // così il ripristino vince anche nel merge multi-dispositivo
            saveCloud();
            if (tab === 'storico') { if (typeof rStorico === 'function') rStorico(); } else if (typeof go === 'function') go(tab || 'oggi');
            window.rvToast('Intervento ripristinato.', { kind:'ok', ms: 2500 });
          } catch(e){ console.error('undo delete', e); alert('Non sono riuscito a ripristinare l\u2019intervento.'); }
        }
      });
    };
  }

  /* ---------- Feedback di salvataggio come toast (oltre all'indicatore) ---------- */
  var prevSetSaveState = window.setSaveState;
  if (typeof prevSetSaveState === 'function') {
    var lastErrToast = 0;
    window.setSaveState = function(t, c){
      prevSetSaveState(t, c);
      try {
        if (/^⚠/.test(String(t || '')) && Date.now() - lastErrToast > 15000) {
          lastErrToast = Date.now();
          window.rvToast(String(t).replace(/^⚠\s*/, '') + ' — i dati restano nella copia locale del dispositivo.', { kind:'error', ms: 6000 });
        }
      } catch(e){}
    };
  }

  /* ---------- Guardia generica anti doppio click sui bottoni primari ---------- */
  document.addEventListener('click', function(ev){
    var b = ev.target && ev.target.closest ? ev.target.closest('.btn') : null;
    if (!b || b.getAttribute('data-rv-busy') === '1') return;
    // solo azioni potenzialmente "scriventi": bottoni dentro le modali o marcati red
    var inModal = b.closest && b.closest('#sheet');
    if (!inModal && !b.classList.contains('red')) return;
    b.setAttribute('data-rv-busy','1');
    setTimeout(function(){ b.removeAttribute('data-rv-busy'); }, 900);
  }, true);

  /* ---------- ESC chiude la modale, blocco scroll sfondo ---------- */
  document.addEventListener('keydown', function(ev){
    if (ev.key === 'Escape') {
      var modal = document.getElementById('modal');
      if (modal && modal.style.display !== 'none' && modal.style.display !== '') { try { closeModal(); } catch(e){} }
    }
  });
  var prevOpenModal = window.openModal, prevCloseModal = window.closeModal;
  if (typeof prevOpenModal === 'function') window.openModal = function(){ prevOpenModal(); try { document.body.style.overflow = 'hidden'; } catch(e){} };
  if (typeof prevCloseModal === 'function') window.closeModal = function(){ prevCloseModal(); try { document.body.style.overflow = ''; } catch(e){} };

  /* ---------- Accessibilità di base ---------- */
  try {
    var nav = document.getElementById('nav');
    if (nav) { nav.setAttribute('role','navigation'); nav.setAttribute('aria-label','Sezioni del gestionale'); }
    var modal = document.getElementById('modal');
    if (modal) { modal.setAttribute('role','dialog'); modal.setAttribute('aria-modal','true'); }
  } catch(e){}

  /* esposto per i test automatici */
  window.__rvUxTest = { toast: window.rvToast, deleteIntervento: window.deleteIntervento };
})();
</script>

@media (prefers-reduced-motion: reduce){#rvAiPanel *{transition:none !important;animation:none !important}}
</style>
<script id="rv-v811-ai-pro-script">
/* v8.11 — Rural Vet AI interfaccia pro: formattazione ricca dei messaggi,
   stato connessione reale, copia messaggio, scroll-to-bottom.
   Additivo: osserva il DOM prodotto dal renderer esistente e lo arricchisce.
   Idempotente per costruzione: il renderer ricrea i nodi, noi li ridecoriamo. */
(function(){
  'use strict';
  var ESC = { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' };
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(m){ return ESC[m]; }); }

  /* ---------- Inline decorations: importi, percentuali, KM, comandi ---------- */
  function inline(safe){
    return safe
      .replace(/(\(?[-+]?\d{1,3}(?:\.\d{3})*(?:,\d{1,2})?\s?€\)?)/g, function(m){
        var neg = /^\(|^-/.test(m.trim());
        return '<b class="rvNum' + (neg ? ' rvNeg' : '') + '">' + m + '</b>';
      })
      .replace(/([-+]?\d{1,3}(?:,\d{1,2})?\s?%)/g, '<b class="rvNum">$1</b>')
      .replace(/(\d[\d.,]*\s?km)\b/gi, '<b class="rvNum">$1</b>')
      .replace(/\b(SALVA|ADESSO)\b/g, '<kbd>$1</kbd>')
      .replace(/\b(ELIMINA)\b/g, '<kbd class="rvKbdDanger">$1</kbd>');
  }

  /* ---------- Formatter: da testo piatto del backend a struttura ---------- */
  function formatMessage(text){
    var lines = String(text || '').split('\n').map(function(l){ return l.trim(); }).filter(function(l){ return l !== ''; });
    if (!lines.length) return '';
    var out = [], i = 0, buf = [];
    function flushPara(){ if (buf.length) { out.push('<p>' + buf.map(function(l){ return inline(esc(l)); }).join('<br>') + '</p>'); buf = []; } }
    // Titolo: prima riga se termina con ':' o contiene ' · ' (riepiloghi con scope)
    if (/[:：]\s*$/.test(lines[0]) || /·/.test(lines[0])) {
      var t = lines[0].replace(/[:：]\s*$/, '');
      var parts = t.split('·');
      var head = esc(parts.shift().trim());
      var scope = parts.length ? '<span class="rvRichScope">' + inline(esc(parts.join('·').trim())) + '</span>' : '';
      out.push('<div class="rvRichTitle">' + head + scope + '</div>');
      i = 1;
    }
    var listType = null, items = [];
    function flushList(){
      if (!items.length) { listType = null; return; }
      out.push('<' + listType + '>' + items.map(function(li){ return '<li><span>' + li + '</span></li>'; }).join('') + '</' + listType + '>');
      items = []; listType = null;
    }
    for (; i < lines.length; i++) {
      var l = lines[i];
      var mRank = l.match(/^(\d+)\)\s+(.*)$/);
      var mBullet = l.match(/^[-•]\s+(.*)$/);
      if (mRank) { flushPara(); if (listType && listType !== 'ol') flushList(); listType = 'ol'; items.push(inline(esc(mRank[2]))); continue; }
      if (mBullet) { flushPara(); if (listType && listType !== 'ul') flushList(); listType = 'ul'; items.push(inline(esc(mBullet[1]))); continue; }
      flushList();
      if (/^(scrivi\s+(salva|elimina)|vuoi\s|posso\s|dimmi\s)/i.test(l)) { flushPara(); out.push('<div class="rvRichHint">' + inline(esc(l)) + '</div>'); continue; }
      buf.push(l);
    }
    flushList(); flushPara();
    return '<div class="rvRich">' + out.join('') + '</div>';
  }

  /* ---------- Decorazione dei messaggi renderizzati ---------- */
  function decorate(box){
    if (!box) return;
    Array.prototype.forEach.call(box.querySelectorAll('.rvAiMsg'), function(msg){
      if (msg.getAttribute('data-rv-pro') === '1') return;
      var pre = msg.querySelector(':scope > pre');
      if (!pre) return; // typing indicator o messaggi senza testo
      msg.setAttribute('data-rv-pro','1');
      var raw = pre.textContent || '';
      if (msg.classList.contains('bot')) {
        var richHtml = formatMessage(raw);
        if (richHtml) {
          var rich = document.createElement('div');
          rich.innerHTML = richHtml;
          pre.replaceWith(rich.firstChild);
        }
        // copia messaggio
        var tools = document.createElement('div');
        tools.className = 'rvMsgTools';
        var copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.textContent = 'Copia';
        copyBtn.setAttribute('aria-label','Copia il messaggio');
        copyBtn.onclick = function(){
          function done(ok){ copyBtn.textContent = ok ? 'Copiato ✓' : 'Errore'; setTimeout(function(){ copyBtn.textContent = 'Copia'; }, 1600); }
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(raw).then(function(){ done(true); }, function(){ done(false); });
          else { try { var ta = document.createElement('textarea'); ta.value = raw; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done(true); } catch(e){ done(false); } }
        };
        tools.appendChild(copyBtn);
        msg.appendChild(tools);
        // Errore di rete/backend → offri "Riprova" con l'ultima richiesta dell'utente
        if (/^(non riesco|errore backend|endpoint rural vet ai non disponibile)/i.test(raw.trim())) {
          var prevUser = null, sib = msg.previousElementSibling;
          while (sib) { if (sib.classList && sib.classList.contains('user')) { prevUser = sib; break; } sib = sib.previousElementSibling; }
          var lastText = prevUser ? (prevUser.querySelector('pre') ? prevUser.querySelector('pre').textContent : prevUser.textContent) : '';
          if (lastText && lastText.trim()) {
            var row = document.createElement('div');
            row.className = 'rvAiQuickButtons';
            var retry = document.createElement('button');
            retry.type = 'button';
            retry.textContent = 'Riprova';
            retry.setAttribute('data-q', lastText.trim());
            retry.onclick = function(){ if (window.rvAiQuickValue) window.rvAiQuickValue(retry); };
            row.appendChild(retry);
            msg.appendChild(row);
          }
        }
      }
    });
  }

  /* ---------- Stato connessione nel header ---------- */
  function endpointBase(){
    try {
      var ep = (window.RV_AI_ENDPOINT || 'https://rural-vet-ai.onrender.com/api/vet-ai-chat');
      var raw = localStorage.getItem('manual-rural-vet-ai');
      if (raw) { var s = JSON.parse(raw); if (s && s.endpoint) ep = s.endpoint; }
      return String(ep).replace(/\/api\/.*$/, '');
    } catch(e){ return ''; }
  }
  var lastPing = 0;
  function refreshStatus(){
    var head = document.querySelector('#rvAiPanel .rvAiHeadText');
    if (!head) return;
    var el = document.getElementById('rvAiStatus');
    if (!el) {
      el = document.createElement('span');
      el.id = 'rvAiStatus';
      el.innerHTML = '<span class="dot"></span><span class="txt">verifica…</span>';
      var title = head.querySelector('.rvAiHeadTitle');
      (title || head).appendChild(el);
    }
    if (Date.now() - lastPing < 30000) return;
    lastPing = Date.now();
    var base = endpointBase();
    if (!base) { el.className = 'offline'; el.querySelector('.txt').textContent = 'endpoint mancante'; return; }
    fetch(base + '/api/health').then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
      if (j && j.ok) { el.className = 'online'; el.querySelector('.txt').textContent = 'online · v' + String(j.version || '').split('-')[0]; }
      else { el.className = 'offline'; el.querySelector('.txt').textContent = 'offline'; }
    }).catch(function(){ el.className = 'offline'; el.querySelector('.txt').textContent = 'offline'; });
  }

  /* ---------- Scroll-to-bottom ---------- */
  function ensureScrollFab(panel, box){
    if (document.getElementById('rvAiScrollDown')) return;
    var b = document.createElement('button');
    b.id = 'rvAiScrollDown';
    b.type = 'button';
    b.setAttribute('aria-label','Vai all\u2019ultimo messaggio');
    b.textContent = '↓';
    b.onclick = function(){ box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' }); };
    panel.appendChild(b);
    box.addEventListener('scroll', function(){
      var away = box.scrollHeight - box.scrollTop - box.clientHeight > 260;
      b.classList.toggle('on', away);
    }, { passive: true });
  }

  /* ---------- Aggancio: il pannello nasce lazy, osservo il body ---------- */
  function hook(){
    var box = document.getElementById('rvAiMessages');
    var panel = document.getElementById('rvAiPanel');
    if (!box || !panel) return false;
    decorate(box);
    refreshStatus();
    ensureScrollFab(panel, box);
    if (!box.__rvProObs) {
      var obs = new MutationObserver(function(){ decorate(box); refreshStatus(); });
      obs.observe(box, { childList: true });
      box.__rvProObs = obs;
    }
    return true;
  }
  if (typeof MutationObserver !== 'undefined' && document.body) {
    var bodyObs = new MutationObserver(function(){ hook(); });
    bodyObs.observe(document.body, { childList: true });
  }
  document.addEventListener('DOMContentLoaded', hook);
  hook();

  /* esposto per i test automatici */
  window.__rvAiProTest = { formatMessage: formatMessage, inline: inline };
})();
</script>
